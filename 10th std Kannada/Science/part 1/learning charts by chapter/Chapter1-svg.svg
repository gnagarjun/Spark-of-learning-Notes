<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 26px; fill: #1a237e; text-anchor: middle; }
      .subtitle { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-size: 16px; fill: #37474f; text-anchor: middle; }
      .section-header { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #ffffff; }
      .card-title { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 15px; fill: #0d47a1; }
      .body-text { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-size: 13px; fill: #212121; }
      .formula-text { font-family: 'Courier New', monospace; font-weight: bold; font-size: 14px; fill: #b71c1c; }
      .box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 2; rx: 8; ry: 8; }
      .header-box { fill: #1565c0; rx: 6; ry: 6; }
      .badge { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1; rx: 4; ry: 4; }
    </style>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1350" fill="#f4f6f9"/>

  <!-- Main Poster Header -->
  <rect x="20" y="20" width="960" height="90" fill="#0d47a1" rx="10" filter="url(#shadow)"/>
  <text x="500" y="55" class="title" fill="#ffffff">೧. ರಾಸಾಯನಿಕ ಕ್ರಿಯೆಗಳು ಮತ್ತು ಸಮೀಕರಣಗಳು</text>
  <text x="500" y="85" class="subtitle" fill="#e0e0e0">10ನೇ ತರಗತಿ ವಿಜ್ಞಾನ (ಭಾಗ-೧) - ಪರೀಕ್ಷಾ ಸಹಾಯಾರ್ಥಿ ಪೋಸ್ಟರ್ ಚಾರ್ಟ್</text>

  <!-- SECTION 1: Evidences -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="960" height="140" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೧. ರಾಸಾಯನಿಕ ಕ್ರಿಯೆ ನಡೆದಿದೆ ಎಂದು ತಿಳಿಸುವ ಲಕ್ಷಣಗಳು (Indicators of Reaction)</text>
    
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="200" height="70" class="badge"/>
      <text x="100" y="25" class="card-title" text-anchor="middle">🎨 ಬಣ್ಣದ ಬದಲಾವಣೆ</text>
      <text x="100" y="50" class="body-text" text-anchor="middle">Fe + CuSO₄ (ನೀಲಿಯಿಂದ ಹಸಿರು)</text>
    </g>
    <g transform="translate(260, 55)">
      <rect x="0" y="0" width="200" height="70" class="badge"/>
      <text x="100" y="25" class="card-title" text-anchor="middle">🌡️ ತಾಪಮಾನದ ಬದಲಾವಣೆ</text>
      <text x="100" y="50" class="body-text" text-anchor="middle">CaO + H₂O (ಉಷ್ಣ ಬಿಡುಗಡೆ)</text>
    </g>
    <g transform="translate(490, 55)">
      <rect x="0" y="0" width="200" height="70" class="badge"/>
      <text x="100" y="25" class="card-title" text-anchor="middle">🫧 ಅನಿಲದ ಬಿಡುಗಡೆ</text>
      <text x="100" y="50" class="body-text" text-anchor="middle">Zn + H₂SO₄ ➔ H₂↑ (ಅನಿಲ)</text>
    </g>
    <g transform="translate(720, 55)">
      <rect x="0" y="0" width="210" height="70" class="badge"/>
      <text x="105" y="25" class="card-title" text-anchor="middle">🧊 ಸ್ಥಿತಿಯ ಬದಲಾವಣೆ</text>
      <text x="105" y="50" class="body-text" text-anchor="middle">ಅನಿಲಗಳು ಸೇರಿ ದ್ರವ ಉಂಟಾಗುವುದು</text>
    </g>
  </g>

  <!-- SECTION 2: Balancing Equations -->
  <g transform="translate(20, 285)">
    <rect x="0" y="0" width="960" height="130" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೨. ಸಮೀಕರಣ ಸರಿದೂಗಿಸುವುದು ಮತ್ತು ರಾಶಿ ಸಂರಕ್ಷಣಾ ನಿಯಮ</text>
    
    <text x="30" y="65" class="body-text">• <tspan font-weight="bold">ರಾಶಿ ಸಂರಕ್ಷಣಾ ನಿಯಮ:</tspan> ಯಾವುದೇ ರಾಸಾಯನಿಕ ಕ್ರಿಯೆಯಲ್ಲಿ ರಾಶಿಯನ್ನು ಸೃಷ್ಟಿಸಲು ಅಥವಾ ನಾಶಪಡಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.</text>
    <text x="30" y="90" class="body-text">• <tspan font-weight="bold">ನಿಯಮ:</tspan> ಪ್ರತಿಕ್ರಿಯಾಕಗಳ ಒಟ್ಟು ಪರಮಾಣುಗಳ ಸಂಖ್ಯೆ = ಉತ್ಪನ್ನಗಳ ಒಟ್ಟು ಪರಮಾಣುಗಳ ಸಂಖ್ಯೆ.</text>
    
    <rect x="620" y="50" width="310" height="65" fill="#fffde7" stroke="#fff59d" stroke-width="2" rx="6"/>
    <text x="630" y="72" class="body-text">ಕಂಕಾಲ ಸಮೀಕರಣ: Mg + O₂ ➔ MgO</text>
    <text x="630" y="97" class="formula-text">ಸರಿದೂಗಿಸಿದ್ದು: 2Mg + O₂ ➔ 2MgO</text>
  </g>

  <!-- SECTION 3: 5 Types of Reactions -->
  <g transform="translate(20, 430)">
    <rect x="0" y="0" width="960" height="640" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೩. ರಾಸಾಯನಿಕ ಕ್ರಿಯೆಗಳ ೫ ಪ್ರಮುಖ ವಿಧಗಳು (Types of Reactions)</text>

    <!-- Reaction A -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="920" height="100" fill="#f1f8e9" stroke="#c5e1a5" rx="6"/>
      <text x="15" y="25" class="card-title">🤝 [A] ಸಂಯೋಗ ಕ್ರಿಯೆ (Combination Reaction)</text>
      <text x="15" y="50" class="body-text">ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ವಸ್ತುಗಳು ಸೇರಿ ಒಂದೇ ಉತ್ಪನ್ನವಾಗುವ ಕ್ರಿಯೆ (A + B ➔ AB).</text>
      <text x="15" y="75" class="formula-text">ಉದಾಹರಣೆ: CaO (ಸುಟ್ಟ ಸುಣ್ಣ) + H₂O ➔ Ca(OH)₂ (ಅರಳಿದ ಸುಣ್ಣ) + ಉಷ್ಣ</text>
    </g>

    <!-- Reaction B -->
    <g transform="translate(20, 165)">
      <rect x="0" y="0" width="920" height="130" fill="#fff3e0" stroke="#ffe0b2" rx="6"/>
      <text x="15" y="25" class="card-title">💥 [B] ವಿಘಟನಾ ಕ್ರಿಯೆ (Decomposition Reaction)</text>
      <text x="15" y="50" class="body-text">ಒಂದು ಸಂಯುಕ್ತವು ಒಡೆದು ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ಸರಳ ಪದಾರ್ಥಗಳಾಗುವ ಕ್ರಿಯೆ (AB ➔ A + B).</text>
      <text x="25" y="75" class="body-text">೧. ಉಷ್ಣ ವಿಘಟನೆ: CaCO₃ ➔ CaO + CO₂  |  ೨. ವಿದ್ಯುತ್ ವಿಘಟನೆ: 2H₂O ➔ 2H₂ + O₂</text>
      <text x="25" y="100" class="formula-text">೩. ಬೆಳಕಿನ ವಿಘಟನೆ: 2AgCl ➔ 2Ag + Cl₂ (ಕಪ್ಪು-ಬಿಳುಪು ಛಾಯಾಗ್ರಹಣದಲ್ಲಿ ಬಳಕೆ)</text>
    </g>

    <!-- Reaction C -->
    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="920" height="95" fill="#e0f7fa" stroke="#b2ebf2" rx="6"/>
      <text x="15" y="25" class="card-title">🥊 [C] ಸ್ಥಾನಪಲ್ಲಟ ಕ್ರಿಯೆ (Displacement Reaction)</text>
      <text x="15" y="50" class="body-text">ಹೆಚ್ಚು ಕ್ರಿಯಾಶೀಲ ಲೋಹವು ಕಡಿಮೆ ಕ್ರಿಯಾಶೀಲ ಲೋಹವನ್ನು ಅದರ ದ್ರಾವಣದಿಂದ ಹೊರಹಾಕುವುದು.</text>
      <text x="15" y="75" class="formula-text">ಉದಾಹರಣೆ: Fe + CuSO₄ (ನೀಲಿ) ➔ FeSO₄ (ಹಸಿರು) + Cu</text>
    </g>

    <!-- Reaction D -->
    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="920" height="95" fill="#f3e5f5" stroke="#e1bee7" rx="6"/>
      <text x="15" y="25" class="card-title">🔄 [D] ದ್ವಿ-ಸ್ಥಾನಪಲ್ಲಟ ಕ್ರಿಯೆ (Double Displacement Reaction)</text>
      <text x="15" y="50" class="body-text">ಪ್ರತಿಕ್ರಿಯಾಕಗಳ ನಡುವೆ ಅಯಾನುಗಳ ವಿನಿಮಯ ನಡೆಯುವ ಕ್ರಿಯೆ.</text>
      <text x="15" y="75" class="formula-text">ಉದಾಹರಣೆ: Na₂SO₄ + BaCl₂ ➔ BaSO₄↓ (ಬಿಳಿ ಪ್ರಕ್ಷೇಪ) + 2NaCl</text>
    </g>

    <!-- Reaction E -->
    <g transform="translate(20, 515)">
      <rect x="0" y="0" width="920" height="110" fill="#fbe9e7" stroke="#ffccbc" rx="6"/>
      <text x="15" y="25" class="card-title">⇄ [E] ರೆಡಾಕ್ಸ್ ಕ್ರಿಯೆ (Redox Reaction = Oxidation + Reduction)</text>
      <text x="15" y="50" class="body-text">• ಉತ್ಕರ್ಷಣೆ (Oxidation): O₂ ಪಡೆಯುವುದು / H₂ ಕಳೆದುಕೊಳ್ಳುವುದು.</text>
      <text x="15" y="70" class="body-text">• ಅಪಕರ್ಷಣೆ (Reduction): O₂ ಕಳೆದುಕೊಳ್ಳುವುದು / H₂ ಪಡೆಯುವುದು.</text>
      <text x="15" y="95" class="formula-text">ಸಮೀಕರಣ: CuO + H₂ ➔ Cu + H₂O  (CuO ಅಪಕರ್ಷಣೆಗೊಳ್ಳುತ್ತದೆ, H₂ ಉತ್ಕರ್ಷಣೆಗೊಳ್ಳುತ್ತದೆ)</text>
    </g>
  </g>

  <!-- SECTION 4: Heat Based Reactions -->
  <g transform="translate(20, 1080)">
    <rect x="0" y="0" width="470" height="110" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="450" height="28" fill="#e65100" rx="4"/>
    <text x="20" y="29" class="section-header">🔥 ಬಹಿರುಷ್ಣಕ ಕ್ರಿಯೆ (Exothermic)</text>
    <text x="20" y="55" class="body-text">• ಕ್ರಿಯೆಯಲ್ಲಿ ಉಷ್ಣ/ಶಕ್ತಿ ಬಿಡುಗಡೆಯಾಗುತ್ತದೆ.</text>
    <text x="20" y="80" class="body-text">• <tspan font-weight="bold">ಉದಾಹರಣೆ:</tspan> ಉಸಿರಾಟ, ನೈಸರ್ಗಿಕ ಅನಿಲದ ದಹನ.</text>
  </g>

  <g transform="translate(510, 1080)">
    <rect x="0" y="0" width="470" height="110" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="450" height="28" fill="#0288d1" rx="4"/>
    <text x="20" y="29" class="section-header">🧊 ಅಂತರುಷ್ಣಕ ಕ್ರಿಯೆ (Endothermic)</text>
    <text x="20" y="55" class="body-text">• ಕ್ರಿಯೆಯಲ್ಲಿ ಉಷ್ಣ/ಶಕ್ತಿಯನ್ನು ಹೀರಿಕೊಳ್ಳಲಾಗುತ್ತದೆ.</text>
    <text x="20" y="80" class="body-text">• <tspan font-weight="bold">ಉದಾಹರಣೆ:</tspan> ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ, ಸುಣ್ಣದ ಕಲ್ಲು ಕಾಯಿಸುವುದು.</text>
  </g>

  <!-- SECTION 5: Everyday Effects -->
  <g transform="translate(20, 1200)">
    <rect x="0" y="0" width="960" height="120" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೫. ದಿನನಿತ್ಯದ ಜೀವನದಲ್ಲಿ ಉತ್ಕರ್ಷಣದ ಪರಿಣಾಮಗಳು (Everyday Oxidation Effects)</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="20" class="card-title">🛡️ ಸವೆತ (Corrosion):</text>
      <text x="0" y="42" class="body-text">ಲೋಹಗಳು ತೇವಾಂಶ/ಆಮ್ಲಗಳಿಂದ ಹಾಳಾಗುವುದು.</text>
      <text x="0" y="62" class="body-text">ಉದಾ: ಕಬ್ಬಿಣ ತುಕ್ಕು ಹಿಡಿಯುವುದು.</text>
    </g>

    <g transform="translate(500, 50)">
      <text x="0" y="20" class="card-title">🍿 ಕಡಸುತನ (Rancidity):</text>
      <text x="0" y="42" class="body-text">ಎಣ್ಣೆ/ಕೊಬ್ಬಿನ ಆಹಾರ ಕೆಟ್ಟ ವಾಸನೆ ಹಾಗೂ ರುಚಿ ಬರುವುದು.</text>
      <text x="0" y="62" class="body-text">ತಡೆಯಲು: ನೈಟ್ರೋಜನ್ (N₂) ಅನಿಲವನ್ನು ತುಂಬಲಾಗುತ್ತದೆ.</text>
    </g>
  </g>
</svg>
