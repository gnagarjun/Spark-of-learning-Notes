<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 24px; fill: #ffffff; text-anchor: middle; }
      .subtitle { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-size: 15px; fill: #e0e0e0; text-anchor: middle; }
      .section-header { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #ffffff; }
      .card-title { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-weight: bold; font-size: 15px; fill: #b45309; }
      .body-text { font-family: 'Noto Sans Kannada', Arial, sans-serif; font-size: 13px; fill: #212121; }
      .formula-text { font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; fill: #b71c1c; }
      .box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 2; rx: 8; ry: 8; }
      .header-box { fill: #d97706; rx: 6; ry: 6; }
      .badge { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 4; ry: 4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="1350" fill="#f4f6f9"/>

  <!-- Header -->
  <rect x="20" y="20" width="960" height="90" fill="#b45309" rx="10" filter="url(#shadow)"/>
  <text x="500" y="55" class="title">೫. ವಿದ್ಯುಚ್ಛಕ್ತಿ (Electricity)</text>
  <text x="500" y="85" class="subtitle">10ನೇ ತರಗತಿ ವಿಜ್ಞಾನ (ಭಾಗ-೧) - ಪರೀಕ್ಷಾ ಸಹಾಯಾರ್ಥಿ ಪೋಸ್ಟರ್ ಚಾರ್ಟ್</text>

  <!-- Section 1: Fundamentals -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="960" height="170" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೧. ಮೂಲಭೂತ ವ್ಯಾಖ್ಯೆಗಳು ಮತ್ತು ಸೂತ್ರಗಳು (Basic Formulas)</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="280" height="95" class="badge"/>
      <text x="140" y="25" class="card-title" text-anchor="middle">⚡ ವಿದ್ಯುತ್ ಪ್ರವಾಹ (I)</text>
      <text x="140" y="50" class="formula-text" text-anchor="middle">I = Q / t</text>
      <text x="140" y="75" class="body-text" text-anchor="middle">ಮಾನಕ: ಆಂಪಿಯರ್ (A) [ಅಮ್ಮೀಟರ್]</text>
    </g>
    <g transform="translate(340, 55)">
      <rect x="0" y="0" width="280" height="95" class="badge"/>
      <text x="140" y="25" class="card-title" text-anchor="middle">🔋 ವಿಭವಾಂತರ (V)</text>
      <text x="140" y="50" class="formula-text" text-anchor="middle">V = W / Q</text>
      <text x="140" y="75" class="body-text" text-anchor="middle">ಮಾನಕ: ವೋಲ್ಟ್ (V) [ವೋಲ್ಟ್ ಮೀಟರ್]</text>
    </g>
    <g transform="translate(660, 55)">
      <rect x="0" y="0" width="280" height="95" class="badge"/>
      <text x="140" y="25" class="card-title" text-anchor="middle">💡 ಓಮ್‌ನ ನಿಯಮ (Ohm's Law)</text>
      <text x="140" y="50" class="formula-text" text-anchor="middle">V = I × R</text>
      <text x="140" y="75" class="body-text" text-anchor="middle">ಸ್ಥಿರ ತಾಪಮಾನದಲ್ಲಿ V ∝ I</text>
    </g>
  </g>

  <!-- Section 2: Factors affecting Resistance -->
  <g transform="translate(20, 315)">
    <rect x="0" y="0" width="960" height="210" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೨. ರೋಧದ ಮೇಲೆ ಪ್ರಭಾವ ಬೀರುವ ಅಂಶಗಳು (Resistance Factors)</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="920" height="135" fill="#fffbebe" stroke="#fef3c7" rx="6"/>
      <text x="15" y="25" class="card-title">ಸೂತ್ರ: R = ρ × (L / A)</text>
      <text x="15" y="50" class="body-text">೧. <tspan font-weight="bold">ಉದ್ದ (L):</tspan> ವಾಹಕದ ಉದ್ದ ಹೆಚ್ಚಾದರೆ ರೋಧ ಹೆಚ್ಚಾಗುತ್ತದೆ (R ∝ L).</text>
      <text x="15" y="75" class="body-text">೨. <tspan font-weight="bold">ಅಡ್ಡಕೊಯ್ತದ ವಿಸ್ತೀರ್ಣ (A):</tspan> ತಂತಿ ದಪ್ಪವಾದರೆ ರೋಧ ಕಡಿಮೆಯಾಗುತ್ತದೆ (R ∝ 1/A).</text>
      <text x="15" y="100" class="body-text">೩. <tspan font-weight="bold">ರೋಧಕತೆ (ρ - Resistivity):</tspan> ವಸ್ತುವಿನ ಸ್ವಭಾವ. ಮಾನಕ: ಓಮ್-ಮೀಟರ್ (Ω·m). ಲೋಹಗಳಿಗೆ ಕಡಿಮೆ, ರೋಧಕಗಳಿಗೆ ಹೆಚ್ಚು.</text>
    </g>
  </g>

  <!-- Section 3: Series vs Parallel -->
  <g transform="translate(20, 540)">
    <rect x="0" y="0" width="960" height="360" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೩. ರೋಧಕಗಳ ಜೋಡಣೆ: ಸರಣಿ ಮತ್ತು ಸಮಾಂತರ (Resistor Circuits)</text>

    <!-- Series -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="450" height="285" fill="#fefce8" stroke="#fef08a" rx="6"/>
      <text x="15" y="25" class="card-title">🔗 ಸರಣಿ ಜೋಡಣೆ (Series Combination)</text>
      <text x="15" y="55" class="formula-text">Rₛ = R₁ + R₂ + R₃</text>
      <text x="15" y="85" class="body-text">• ಪ್ರತಿಯೊಂದು ರೋಧಕದಲ್ಲೂ <tspan font-weight="bold">ಒಂದೇ ವಿದ್ಯುತ್ ಪ್ರವಾಹ (I)</tspan> ಹರಿಯುತ್ತದೆ.</text>
      <text x="15" y="115" class="body-text">• ಒಟ್ಟು ವಿಭವಾಂತರ: V = V₁ + V₂ + V₃.</text>
      <text x="15" y="145" class="body-text">• ಒಟ್ಟು ರೋಧವು ಗರಿಷ್ಠವಾಗಿರುತ್ತದೆ.</text>
      
      <rect x="15" y="170" width="420" height="100" fill="#ffffff" stroke="#fde047" rx="4"/>
      <text x="25" y="195" class="card-title">⚠️ ಅನಾನುಕೂಲ:</text>
      <text x="25" y="220" class="body-text">ಒಂದು ಉಪಕರಣ ಹಾಳಾದರೂ ಇಡೀ ಮಂಡಲ ಬಂದ್ ಆಗುತ್ತದೆ. ಗೃಹಬಳಕೆಗೆ ಸೂಕ್ತವಲ್ಲ!</text>
    </g>

    <!-- Parallel -->
    <g transform="translate(490, 55)">
      <rect x="0" y="0" width="450" height="285" fill="#f0fdf4" stroke="#bbf7d0" rx="6"/>
      <text x="15" y="25" class="card-title">🔀 ಸಮಾಂತರ ಜೋಡಣೆ (Parallel Combination)</text>
      <text x="15" y="55" class="formula-text">1/Rₚ = 1/R₁ + 1/R₂ + 1/R₃</text>
      <text x="15" y="85" class="body-text">• ಪ್ರತಿಯೊಂದು ಉಪಕರಣಕ್ಕೂ <tspan font-weight="bold">ಸಮಾನ ವಿಭವಾಂತರ (V)</tspan> ಸಿಗುತ್ತದೆ.</text>
      <text x="15" y="115" class="body-text">• ಒಟ್ಟು ವಿದ್ಯುತ್ ಪ್ರವಾಹ: I = I₁ + I₂ + I₃.</text>
      <text x="15" y="145" class="body-text">• ಒಟ್ಟು ರೋಧವು ಕನಿಷ್ಠವಾಗಿರುತ್ತದೆ.</text>

      <rect x="15" y="170" width="420" height="100" fill="#ffffff" stroke="#86efac" rx="4"/>
      <text x="25" y="195" class="card-title">✅ ಅನುಕೂಲ (ಗೃಹಬಳಕೆಗೆ ಸೂಕ್ತ):</text>
      <text x="25" y="220" class="body-text">ಪ್ರತಿಯೊಂದು ಸಾಧನಕ್ಕೂ ಸ್ವತಂತ್ರ ಸ್ವಿಚ್ ಇರುತ್ತದೆ. ಒಂದರ ವೈಫಲ್ಯದಿಂದ ಇತರ ಉಪಕರಣಗಳು ಬಂದ್ ಆಗುವುದಿಲ್ಲ.</text>
    </g>
  </g>

  <!-- Section 4: Heating Effect & Power -->
  <g transform="translate(20, 915)">
    <rect x="0" y="0" width="960" height="410" class="box" filter="url(#shadow)"/>
    <rect x="10" y="10" width="940" height="32" class="header-box"/>
    <text x="20" y="32" class="section-header">೪. ಉಷ್ಣೋತ್ಪನ್ನ ಪರಿಣಾಮ ಮತ್ತು ವಿದ್ಯುತ್ ಸಾಮರ್ಥ್ಯ (Heating Effect &amp; Power)</text>

    <!-- Joule's Law -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="920" height="150" fill="#fff1f2" stroke="#fecdd3" rx="6"/>
      <text x="15" y="25" class="card-title">🔥 ಜೌಲನ ಕಾಯುವಿಕೆಯ ನಿಯಮ (Joule's Law of Heating)</text>
      <text x="15" y="55" class="formula-text">H = I² × R × t</text>
      <text x="15" y="85" class="body-text">• ಉತ್ಪತ್ತಿಯಾಗುವ ಉಷ್ಣವು (H): ೧. ವಿದ್ಯುತ್ ಪ್ರವಾಹದ ವರ್ಗಕ್ಕೆ (I²)  ೨. ರೋಧಕ್ಕೆ (R)  ೩. ಕಾಲಕ್ಕೆ (t) ನೇರ ಅನುಪಾತದಲ್ಲಿದೆ.</text>
      <text x="15" y="115" class="body-text">• <tspan font-weight="bold">ಅನ್ವಯಗಳು:</tspan> ವಿದ್ಯುತ್ ಹೀಟರ್, ಇಸ್ತ್ರಿ ಪೆಟ್ಟಿಗೆ, ಫ್ಯೂಸ್ ತಂತಿ, ಬಲ್ಬ್‌ನ ಟಂಗ್‌ಸ್ಟನ್ ಫಿಲಮೆಂಟ್.</text>
    </g>

    <!-- Electric Power -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="920" height="170" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
      <text x="15" y="25" class="card-title">⚡ ವಿದ್ಯುತ್ ಸಾಮರ್ಥ್ಯ (Electric Power - P)</text>
      <text x="15" y="55" class="formula-text">P = V × I  |  P = I² × R  |  P = V² / R</text>
      <text x="15" y="85" class="body-text">• SI ಮಾನಕ: ವ್ಯಾಟ್ (Watt - W).  (1 W = 1 V × 1 A)</text>
      <text x="15" y="115" class="body-text">• <tspan font-weight="bold">ವ್ಯಾಪಾರಿಕ ಮಾನಕ:</tspan> ಕಿಲೋವ್ಯಾಟ್ ಗಂಟೆ (kWh) ಅಥವಾ "ಯುನಿಟ್".</text>
      <text x="15" y="140" class="formula-text">1 kWh = 3.6 × 10⁶ J (ಜೌಲ್)</text>
    </g>
  </g>
</svg>
